name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux, liste de la doc JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev xvfb fonts-dejavu-core gdb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (cœur + tests)
        run: cmake --build build --config Release --parallel --target neptune_core_tests

      - name: Tests du cœur
        run: ctest --test-dir build -C Release --output-on-failure

      # Informatif : les runners sont partagés, les temps sont bruités. Jamais bloquant ; le JSON est archivé (voir docs/performance.md).
      - name: Mesure de performance du callback (informatif)
        continue-on-error: true
        shell: bash
        run: |
          cmake --build build --config Release --target neptune_perf_callback
          PERF=$(find build -type f \( -name 'neptune_perf_callback' -o -name 'neptune_perf_callback.exe' \) -print -quit)
          mkdir -p perf
          "$PERF" --save "perf/perf-${{ matrix.name }}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Perf-${{ matrix.name }}
          path: perf/*.json
          if-no-files-found: ignore

      - name: Build (plugins CLAP, Neptune, Moussaillon, AnalogSynth, FM6Op, Orgamon, La Flèche, Compresseur, Egaliseur, Délai, Chœur, Microdécale et Convolution)
        run: cmake --build build --config Release --parallel ${{ runner.os == 'Linux' && '2' || '4' }} --target Neptune_CLAP Moussaillon_CLAP AnalogSynth_CLAP FM6Op_CLAP Orgamon_CLAP LaFleche_CLAP Compresseur_CLAP Egaliseur_CLAP Delai_CLAP Choeur_CLAP Microdecale_CLAP Convolution_CLAP Diapason_CLAP

      # Galerie des composants communs NOVA rendue en PNG (Linux, sous xvfb) : sert à comparer avec les maquettes HTML.
      - name: NovaGallery (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --parallel ${{ runner.os == 'Linux' && '2' || '4' }} --target NovaGallery
          BIN=$(find build/adapter-juce -type f -name NovaGallery -perm -u+x -print -quit)
          test -n "$BIN" || { echo "NovaGallery introuvable"; exit 1; }
          xvfb-run -a "$BIN" nova-gallery || { xvfb-run -a gdb -batch -ex run -ex bt --args "$BIN" nova-gallery; exit 1; }

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: NovaGallery
          path: nova-gallery/*.png
          if-no-files-found: error

      # clap-validator 0.4.1 (free-audio, MIT), Linux seulement ; le rapport complet est dans les logs.
      - name: clap-validator (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o cv.zip "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip"
          sha256sum cv.zip
          unzip -q cv.zip -d cv
          for t in cv/*.tar.gz; do tar -xzf "$t" -C cv; done   # le zip contient une archive tar.gz
          find cv -type f
          CV=$(find cv -type f -name 'clap-validator*' ! -name '*.zip' ! -name '*.tar.gz' -print -quit)
          test -n "$CV" || { echo "binaire introuvable dans l'archive"; exit 1; }
          chmod +x "$CV"
          CLAP=$(find build/adapter-juce/Neptune_artefacts -name 'Neptune.clap' -print -quit)
          "$CV" validate "$CLAP"
          MOUS=$(find build/adapter-juce/Moussaillon_artefacts -name 'Moussaillon.clap' -print -quit)
          test -n "$MOUS" || { echo "Moussaillon.clap introuvable"; exit 1; }
          "$CV" validate "$MOUS"
          ANAL=$(find build/adapter-juce/AnalogSynth_artefacts -name 'AnalogSynth.clap' -print -quit)
          test -n "$ANAL" || { echo "AnalogSynth.clap introuvable"; exit 1; }
          "$CV" validate "$ANAL"
          FM6=$(find build/adapter-juce/FM6Op_artefacts -name 'FM6Op.clap' -print -quit)
          test -n "$FM6" || { echo "FM6Op.clap introuvable"; exit 1; }
          "$CV" validate "$FM6"
          ORG=$(find build/adapter-juce/Orgamon_artefacts -name 'Orgamon.clap' -print -quit)
          test -n "$ORG" || { echo "Orgamon.clap introuvable"; exit 1; }
          "$CV" validate "$ORG"
          LAF=$(find build/adapter-juce/LaFleche_artefacts -name 'LaFleche.clap' -print -quit)
          test -n "$LAF" || { echo "LaFleche.clap introuvable"; exit 1; }
          "$CV" validate "$LAF"
          COM=$(find build/adapter-juce/Compresseur_artefacts -name 'Compresseur.clap' -print -quit)
          test -n "$COM" || { echo "Compresseur.clap introuvable"; exit 1; }
          "$CV" validate "$COM"
          EGA=$(find build/adapter-juce/Egaliseur_artefacts -name 'Egaliseur.clap' -print -quit)
          test -n "$EGA" || { echo "Egaliseur.clap introuvable"; exit 1; }
          "$CV" validate "$EGA"
          DEL=$(find build/adapter-juce/Delai_artefacts -name 'Delai.clap' -print -quit)
          test -n "$DEL" || { echo "Delai.clap introuvable"; exit 1; }
          "$CV" validate "$DEL"
          CHO=$(find build/adapter-juce/Choeur_artefacts -name 'Choeur.clap' -print -quit)
          test -n "$CHO" || { echo "Choeur.clap introuvable"; exit 1; }
          "$CV" validate "$CHO"
          MIC=$(find build/adapter-juce/Microdecale_artefacts -name 'Microdecale.clap' -print -quit)
          test -n "$MIC" || { echo "Microdecale.clap introuvable"; exit 1; }
          "$CV" validate "$MIC"
          CNV=$(find build/adapter-juce/Convolution_artefacts -name 'Convolution.clap' -print -quit)
          test -n "$CNV" || { echo "Convolution.clap introuvable"; exit 1; }
          "$CV" validate "$CNV"
          DIA=$(find build/adapter-juce/Diapason_artefacts -name 'Diapason.clap' -print -quit)
          test -n "$DIA" || { echo "Diapason.clap introuvable"; exit 1; }
          "$CV" validate "$DIA"

      # Ne garder que le .clap (sur macOS c'est un bundle : on l'archive pour conserver les droits d'exécution).
      - name: Archive le .clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/Neptune_artefacts -name 'Neptune.clap' -print -quit)
          test -n "$CLAP" || { echo "Neptune.clap introuvable"; exit 1; }
          mkdir -p dist/stage
          cp -R "$CLAP" dist/stage/
          cd dist/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../Neptune-${{ matrix.name }}.zip" Neptune.clap
          else
            tar -czf "../Neptune-${{ matrix.name }}.tar.gz" Neptune.clap
          fi
          cd ../..
          rm -rf dist/stage
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: Neptune-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # Le plugin séparé (l'Utilitaire de la suite), archivé à part.
      - name: Archive Moussaillon.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/Moussaillon_artefacts -name 'Moussaillon.clap' -print -quit)
