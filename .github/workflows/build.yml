  release:
    # Publie une Release GitHub quand on pousse un tag « v* » (ex. : git tag v0.0.2 && git push --tags).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Neptune ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease

      # Diapason séparé, archivé à part.
      - name: Archive Diapason.clap
