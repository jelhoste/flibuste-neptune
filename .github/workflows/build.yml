name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux, liste de la doc JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (cœur + tests)
        run: cmake --build build --config Release --parallel --target neptune_core_tests

      - name: Tests du cœur
        run: ctest --test-dir build -C Release --output-on-failure

      # Informatif : les runners sont partagés, les temps sont bruités. Jamais bloquant ; le JSON est archivé (voir docs/performance.md).
      - name: Mesure de performance du callback (informatif)
        continue-on-error: true
        shell: bash
        run: |
          cmake --build build --config Release --target neptune_perf_callback
          PERF=$(find build -type f \( -name 'neptune_perf_callback' -o -name 'neptune_perf_callback.exe' \) -print -quit)
          mkdir -p perf
          "$PERF" --save "perf/perf-${{ matrix.name }}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Perf-${{ matrix.name }}
          path: perf/*.json
          if-no-files-found: ignore

      - name: Build (plugins CLAP, Neptune, Moussaillon, AnalogSynth, FM6Op, Orgamon et La Flèche)
        run: cmake --build build --config Release --parallel --target Neptune_CLAP Moussaillon_CLAP AnalogSynth_CLAP FM6Op_CLAP Orgamon_CLAP LaFleche_CLAP

      # clap-validator 0.4.1 (free-audio, MIT), Linux seulement ; le rapport complet est dans les logs.
      - name: clap-validator (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o cv.zip "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip"
          sha256sum cv.zip
          unzip -q cv.zip -d cv
          for t in cv/*.tar.gz; do tar -xzf "$t" -C cv; done   # le zip contient une archive tar.gz
          find cv -type f
          CV=$(find cv -type f -name 'clap-validator*' ! -name '*.zip' ! -name '*.tar.gz' -print -quit)
          test -n "$CV" || { echo "binaire introuvable dans l'archive"; exit 1; }
          chmod +x "$CV"
          CLAP=$(find build/adapter-juce/Neptune_artefacts -name 'Neptune.clap' -print -quit)
          "$CV" validate "$CLAP"
          MOUS=$(find build/adapter-juce/Moussaillon_artefacts -name 'Moussaillon.clap' -print -quit)
          test -n "$MOUS" || { echo "Moussaillon.clap introuvable"; exit 1; }
          "$CV" validate "$MOUS"
          ANAL=$(find build/adapter-juce/AnalogSynth_artefacts -name 'AnalogSynth.clap' -print -quit)
          test -n "$ANAL" || { echo "AnalogSynth.clap introuvable"; exit 1; }
          "$CV" validate "$ANAL"
          FM6=$(find build/adapter-juce/FM6Op_artefacts -name 'FM6Op.clap' -print -quit)
          test -n "$FM6" || { echo "FM6Op.clap introuvable"; exit 1; }
          "$CV" validate "$FM6"
          ORG=$(find build/adapter-juce/Orgamon_artefacts -name 'Orgamon.clap' -print -quit)
          test -n "$ORG" || { echo "Orgamon.clap introuvable"; exit 1; }
          "$CV" validate "$ORG"
          LAF=$(find build/adapter-juce/LaFleche_artefacts -name 'LaFleche.clap' -print -quit)
          test -n "$LAF" || { echo "LaFleche.clap introuvable"; exit 1; }
          "$CV" validate "$LAF"

      # Ne garder que le .clap (sur macOS c'est un bundle : on l'archive pour conserver les droits d'exécution).
      - name: Archive le .clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/Neptune_artefacts -name 'Neptune.clap' -print -quit)
          test -n "$CLAP" || { echo "Neptune.clap introuvable"; exit 1; }
          mkdir -p dist/stage
          cp -R "$CLAP" dist/stage/
          cd dist/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../Neptune-${{ matrix.name }}.zip" Neptune.clap
          else
            tar -czf "../Neptune-${{ matrix.name }}.tar.gz" Neptune.clap
          fi
          cd ../..
          rm -rf dist/stage
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: Neptune-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # Le plugin séparé (l'Utilitaire de la suite), archivé à part.
      - name: Archive Moussaillon.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/Moussaillon_artefacts -name 'Moussaillon.clap' -print -quit)
          test -n "$CLAP" || { echo "Moussaillon.clap introuvable"; exit 1; }
          mkdir -p dist-mous/stage
          cp -R "$CLAP" dist-mous/stage/
          cd dist-mous/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../Moussaillon-${{ matrix.name }}.zip" Moussaillon.clap
          else
            tar -czf "../Moussaillon-${{ matrix.name }}.tar.gz" Moussaillon.clap
          fi
          cd ../..
          rm -rf dist-mous/stage
          ls -la dist-mous

      - uses: actions/upload-artifact@v7
        with:
          name: Moussaillon-${{ matrix.name }}
          path: dist-mous/*
          if-no-files-found: error

      # Le synthé séparé, archivé à part.
      - name: Archive AnalogSynth.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/AnalogSynth_artefacts -name 'AnalogSynth.clap' -print -quit)
          test -n "$CLAP" || { echo "AnalogSynth.clap introuvable"; exit 1; }
          mkdir -p dist-anal/stage
          cp -R "$CLAP" dist-anal/stage/
          cd dist-anal/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../AnalogSynth-${{ matrix.name }}.zip" AnalogSynth.clap
          else
            tar -czf "../AnalogSynth-${{ matrix.name }}.tar.gz" AnalogSynth.clap
          fi
          cd ../..
          rm -rf dist-anal/stage
          ls -la dist-anal

      - uses: actions/upload-artifact@v7
        with:
          name: AnalogSynth-${{ matrix.name }}
          path: dist-anal/*
          if-no-files-found: error

      # Le synthé FM séparé, archivé à part.
      - name: Archive FM6Op.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/FM6Op_artefacts -name 'FM6Op.clap' -print -quit)
          test -n "$CLAP" || { echo "FM6Op.clap introuvable"; exit 1; }
          mkdir -p dist-fm/stage
          cp -R "$CLAP" dist-fm/stage/
          cd dist-fm/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../FM6Op-${{ matrix.name }}.zip" FM6Op.clap
          else
            tar -czf "../FM6Op-${{ matrix.name }}.tar.gz" FM6Op.clap
          fi
          cd ../..
          rm -rf dist-fm/stage
          ls -la dist-fm

      - uses: actions/upload-artifact@v7
        with:
          name: FM6Op-${{ matrix.name }}
          path: dist-fm/*
          if-no-files-found: error

      # L'orgue séparé, archivé à part.
      - name: Archive Orgamon.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/Orgamon_artefacts -name 'Orgamon.clap' -print -quit)
          test -n "$CLAP" || { echo "Orgamon.clap introuvable"; exit 1; }
          mkdir -p dist-org/stage
          cp -R "$CLAP" dist-org/stage/
          cd dist-org/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../Orgamon-${{ matrix.name }}.zip" Orgamon.clap
          else
            tar -czf "../Orgamon-${{ matrix.name }}.tar.gz" Orgamon.clap
          fi
          cd ../..
          rm -rf dist-org/stage
          ls -la dist-org

      - uses: actions/upload-artifact@v7
        with:
          name: Orgamon-${{ matrix.name }}
          path: dist-org/*
          if-no-files-found: error

      # Le shaper de transitoires séparé (La Flèche), archivé à part.
      - name: Archive LaFleche.clap
        shell: bash
        run: |
          CLAP=$(find build/adapter-juce/LaFleche_artefacts -name 'LaFleche.clap' -print -quit)
          test -n "$CLAP" || { echo "LaFleche.clap introuvable"; exit 1; }
          mkdir -p dist-laf/stage
          cp -R "$CLAP" dist-laf/stage/
          cd dist-laf/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../LaFleche-${{ matrix.name }}.zip" LaFleche.clap
          else
            tar -czf "../LaFleche-${{ matrix.name }}.tar.gz" LaFleche.clap
          fi
          cd ../..
          rm -rf dist-laf/stage
          ls -la dist-laf

      - uses: actions/upload-artifact@v7
        with:
          name: LaFleche-${{ matrix.name }}
          path: dist-laf/*
          if-no-files-found: error

  release:
    # Publie une Release GitHub quand on pousse un tag « v* » (ex. : git tag v0.0.2 && git push --tags).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Neptune ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
