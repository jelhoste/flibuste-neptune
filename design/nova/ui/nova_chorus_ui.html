<style>

[data-theme=hc] .card,[data-theme=hc] .snav,[data-theme=hc] .zn,[data-theme=hc] .panel,[data-theme=hc] .mg,[data-theme=hc] .pill,[data-theme=hc] .kc,[data-theme=hc] .side,[data-theme=hc] .mp,[data-theme=hc] .header,[data-theme=hc] .bottom{border-width:2px}
*{box-sizing:border-box}*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rc{display:flex;align-items:center;gap:14px;margin-left:auto}.static{cursor:default}
.zh .pill{width:auto;flex:1;padding:3px 4px;font-size:9px}.zn{flex:1;min-width:0;overflow:hidden;border-radius:var(--cr);background:var(--panel-bg);border:1px solid var(--pb);border-top-color:var(--pbt);box-shadow:var(--csh);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px}

.zn.off .zr,.zn.off .qs{opacity:.4}.krow2.alloff .zn{opacity:.35}
.snav{grid-column:1;grid-row:1;margin:14px 0 0 14px;background:var(--panel-bg);border:1px solid var(--pb);border-top-color:var(--pbt);border-radius:var(--cr);padding:14px 8px;box-shadow:var(--csh);display:none;flex-direction:column;gap:3px}

.nsb:hover .nst{background:var(--accent-2)}.nsb.drag .nst{background:var(--accent);cursor:grabbing}
[data-theme=hc] .nsb{background:#000;border:2px solid #fff}[data-theme=hc] .nst{background:#fff}[data-theme=hc] .nsb:hover .nst,[data-theme=hc] .nsb.drag .nst{background:var(--accent)}
.card{background:var(--panel-bg);border:1px solid var(--pb);border-top-color:var(--pbt);border-radius:var(--cr);padding:16px 20px;margin-bottom:14px;box-shadow:var(--csh)}
.ct{font-size:12px;font-weight:700;letter-spacing:.6px;display:flex;align-items:center;gap:8px;margin-bottom:6px}

.slab{font-size:12px;font-weight:600}.sdesc{font-size:10px;color:var(--text-dim2);margin-top:2px;line-height:1.4}.sctl{display:flex;align-items:center;gap:10px;flex-shrink:0}

.stpr{display:inline-flex;align-items:center;gap:4px}.stp{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--ctl-bd);border-radius:4px;color:var(--text-dim);font-size:13px;cursor:pointer;user-select:none;box-shadow:var(--ctl-sh)}.stp:hover{color:var(--text)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.rmsr{display:flex;align-items:center;gap:8px;padding:6px 0}.lnk{font-size:12px;color:var(--accent-2);cursor:pointer}
.hr{display:flex;align-items:center;gap:10px}

.cpill button{width:26px;height:26px;border:none;background:none;color:var(--text-dim);font-size:15px;font-weight:700;cursor:pointer;border-radius:var(--ibr);font-family:inherit}.cpill button:hover{color:var(--text)}.cpill button:disabled{opacity:.35;cursor:default}

/* ===== Chorus : ajouts au socle commun ===== */
#app{position:relative}
.mp{gap:8px;padding:12px 6px}
.mode.static{cursor:default}
.dot.off{background:var(--grid)}
.dis{opacity:.4;pointer-events:none}
.dim{opacity:.45}
.pill.act{color:var(--text);border-color:var(--navb)}
.ibtn.act{color:var(--accent);border-color:var(--navb)}
#app.byp .cw canvas,#app.byp .krow{opacity:.45}
#irPill{width:420px;color:var(--text);font-size:13px;cursor:pointer}#irName{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* menu de presets */
.pm{position:absolute;display:none;z-index:90;width:420px;max-height:460px;overflow:auto;box-sizing:border-box;padding:6px;background:var(--bg-card);border:1px solid var(--ctl-bd);border-top-color:var(--pbt);border-radius:var(--cr);box-shadow:0 14px 36px rgba(0,0,0,.5)}
[data-theme=hc] .pm{border:2px solid #fff;box-shadow:none;background:#000}
.pm .pg{font-size:8px;letter-spacing:1.2px;font-weight:700;color:var(--text-dim2);padding:8px 10px 4px}
.pm .pi{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer}
.pm .pi:hover{background:var(--ov)}.pm .pi.on{color:var(--accent-2);border:1px solid var(--navb);padding:6px 9px}
.pm .pi .pv{margin-left:auto;font-size:9.5px;color:var(--text-dim2)}
.scnote{font-size:10px;color:var(--text-dim2);margin-top:6px;line-height:1.4}
.zn .scnote{padding:0 10px 8px}
.bottom .pill .mv{margin-left:6px;color:var(--text)}

<body>
<div id="stage">
<div class="stage-label" id="stageLabel">CHORUS</div>
<div id="app" class="app-frame">
  <div class="header">

      <div><div class="word">NOVA</div><div class="sub">CHORUS</div></div></div>
    <div class="pill" id="irPill" title="Choisir un preset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M2 12c2.5-7 5-7 7.5 0s5 7 7.5 0 3-5 5-5"/></svg>
      <span id="irName"></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="hr"><div class="cpill" id="cPill" role="group" aria-label="Contraste"><button id="cMinus" aria-label="Diminuer le contraste">−</button><span class="cl"><svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span id="cLvl">0</span></span><button id="cPlus" aria-label="Augmenter le contraste">+</button></div><div class="ibtn" id="themeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div><div class="ibtn act" id="bypBtn" title="Bypass (allumé = plugin actif)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></div></div>
  </div>
  <div class="body">

s Juno-60 l'utilisent à environ 60 %.", "meta": "0…100 % · Défaut 0 · Automatisable : oui ### 2.4 Sortie"}, "cho_interp": {"label": "Interpolation", "short": "Qualité de lecture de la ligne à retard.", "long": "Cubique : plus propre, surtout avec un retard long et un DEPTH élevé. Linéaire : un peu plus léger pour le processeur et très légèrement plus sombre.", "meta": "Choix : Linéaire, Cubique · Défaut Cubique"}, "cho_lfo_start": {"label": "LFO start", "short": "Phase de départ du LFO.", "long": "Libre : le LFO tourne en continu. À chaque lecture : il repart de la même phase au démarrage du transport, pour que chaque lecture sonne identique (utile pour le rendu).", "meta": "Choix : Libre, À chaque lecture · Défaut Libre Autres réglages de Settings, communs à la série : précision interne, latence reportée (0 pour le chorus), module vu-mètres (`meter_*`), presets, interaction, aide « ? ». --- ## 3. Sorties d'affichage (lecture seule, non automatisables) | id | Contenu | Plage | |---|---|---| | `cho_lfo_phase_out` | phase du LFO du canal gauche, voix 1 (la droite et les autres voix s'en déduisent avec WIDTH et VOICES) | 0…1 | Une seule sortie suffit à animer le graphique central (point qui parcourt les courbes de retard) : tout le reste est calculé par l'UI à partir des paramètres. Module vu-mètres : préfixe `meter_`, identique aux autres plugins (IN après le gain d'entrée absent ici : IN = entrée du plugin, OUT après OUTPUT). --- ## 4. Presets d'usine Les valeurs ci-dessous sont des points de départ. Les trois presets « Juno-60 » sont une approximation du chorus du Juno-60 (lignes BBD, LFO triangle, déphasage gauche / droite) à valider à l'écoute et par mesure. | Preset | RATE Hz | DEPTH % | DELAY ms | SHAPE | VOICES | WIDTH % | FEEDBACK % | BBD % | MIX % | |---|---|---|---|---|---|---|---|---|---| | Juno-60 I | 0,51 | 54 | 3,35 | Tri | 1 | 100 | 0 | 60 | 50 | | Juno-60 II | 0,86 | 54 | 3,35 | Tri | 1 | 100 | 0 | 60 | 50 | | Juno-60 I+II | 9,75 | 8 | 3,35 | Tri | 1 |
