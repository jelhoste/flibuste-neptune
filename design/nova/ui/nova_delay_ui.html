<div id="stage">
<div class="stage-label" id="stageLabel">DELAY</div>

<script>window.NOVA_HELP=/*HELP_BEGIN*/{"dly_feedback": {"label": "FEEDBACK", "short": "Part de la ligne réinjectée dans elle-même.", "long": "Règle le nombre de répétitions de cette ligne. Chaque répétition passe de nouveau par les filtres, le décalage de hauteur et la saturation, donc devient plus sombre et plus colorée. En négatif, chaque répétition est inversée en phase (son plus creux). Au-delà de 80 %, les échos durent très longtemps.", "meta": "−95…+95 % · Défaut 30 · Automatisable : oui"}, "dly_pitch": {"label": "PITCH", "short": "Décale la hauteur des échos de cette ligne.", "long": "Décale la hauteur de ±24 demi-tons, sans changer le temps de la ligne. Comme la ligne se réécoute avec son feedback, chaque répétition est décalée de nouveau : +12 donne des échos de plus en plus aigus (effet shimmer), −12 de plus en plus graves.", "meta": "−24…+24 demi-tons · Défaut 0 · Automatisable : oui"}, "dly_offset": {"label": "R OFFSET", "short": "Décale le canal droit par rapport au gauche, en ms.", "long": "Ajoute (ou retire, en négatif) un temps de retard au canal droit seulement. Quelques millisecondes élargissent l'image ; des valeurs plus grandes donnent un effet ping-pong naturel, même avec une entrée mono. Le droit ne peut jamais arriver avant le signal d'entrée : si l'offset négatif dépasse le temps de la ligne, le droit reste à 0 ms (pas de look-ahead).", "meta": "−100…+100 ms · Défaut 0 · Automatisable : oui"}, "dly_mod_depth": {"label": "MOD DEPTH", "short": "Profondeur de la modulation du temps de la ligne.", "long": "Fait osciller légèrement le temps de la ligne (de 0 à environ ±8 ms). Une petite valeur ajoute du mouvement, comme un delay à bande ou analogique ; une grande valeur fait vibrer la hauteur des échos.", "meta": "0…100 % · Défaut 0 · Automatisable : oui"}, "dly_mod_rate": {"label": "MOD RATE", "short": "Vitesse de la modulation du temps.", "long": "Nombre de cycles par seconde du LFO de modulation. N'a d'effet que si MOD DEPTH n'est pas à 0.", "meta": "0,05…10 Hz · Défaut 0,5 · Automatisable : oui --- ## 3. Paramètres globaux | id | label | type | plage | défaut | unité · échelle | auto | page · contrôle | |---|---|---|---|---|---|---|---| | `dly_sync` | SYNC | bool | — | 0 | — | oui | GLOBAL (mini-contrôle) | | `dly_routing` | ROUTING | enum | 0 Parallèle, 1 Cascade | 0 | — | non | GLOBAL (mini-contrôle) | | `dly_freeze` | FREEZE | bool | — | 0 | — | oui | GLOBAL (mini-contrôle) | | `dly_duck_amount` | DUCK AMOUNT | float | 0…100 | 0 | % | oui | GLOBAL (mini-contrôle) | | `dly_duck_thresh` | DUCK THRESHOLD | float | −60…0 | −30 | dB | oui | GLOBAL (mini-contrôle) | | `dly_duck_release` | DUCK RELEASE | float | 10…2000 | 300 | ms · log | oui | GLOBAL (mini-contrôle) | | `dly_fb_global` | FEEDBACK | float | −95…+95 | 0 | % · bipolaire | oui | GLOBAL (potard) | | `dly_pingpong` | PING-PONG | float | 0…100 | 0 | % | oui | GLOBAL (potard) | | `dly_drive` | DRIVE | float | 0…100 | 0 | % | oui | GLOBAL (potard) | | `dly_width` | WIDTH | float | 0…200 | 100 | % | oui | GLOBAL (potard) | | `dly_input_gain` | INPUT | float | −24…+24 | 0 | dB | oui | GLOBAL (potard) | | `dly_mix` | MIX | float | 0…100 | 35 | % | oui | DELAY (potard) | | `dly_output_gain` | OUTPUT | float | −24…+24 | 0 | dB | oui | DELAY (potard) | | `dly_bypass` | BYPASS | bool | — | 0 | — | oui | bouton de l'en-tête (fondu de 10 ms) | ### Aides des réglages globaux"}, "dly_routing": {"label": "ROUTING", "short": "Comment les huit lignes sont reliées entre elles.", "long": "Parallèle : chaque ligne écoute directement l'entrée, et les huit échos s'additionnent. Cascade : chaque ligne écoute la sortie de la précédente, donc les temps s'additionnent (la ligne 3 est retardée de la somme des temps des lignes 1, 2 et 3). Cascade est utile pour construire des motifs rythmiques à partir de petits intervalles.", "meta": "Choix : Parallèle, Cascade · Défaut Parallèle"}, "dly_pingpong": {"label": "PING-PONG", "short": "Renvoie les échos alternativement à gauche et à droite.", "long": "À 0 %, chaque écho reste du même côté. À 100 %, le feedback traverse les canaux : un écho à gauche donne l'écho suivant à droite, et ainsi de suite. Utilise le feedback de chaque ligne et le feedback global.", "meta": "0…100 % · Défaut 0 · Automatisable : oui"}, "dly_duck_amount": {"label": "DUCK AMOUNT", "short": "Baisse les échos pendant que le signal joue.", "long": "Atténue le signal retardé quand le signal d'entrée dépasse DUCK THRESHOLD, puis le laisse revenir pendant les silences (temps réglé par DUCK RELEASE). Garde la voix ou la caisse claire claire et nette tout en laissant les échos s'épanouir entre les phrases ou les coups.", "meta": "0…100 % · Défaut 0 · Automatisable : oui"}, "dly_drive": {"label": "DRIVE", "short": "Saturation douce dans la boucle de feedback.", "long": "Chaque passage dans la boucle sature légèrement le signal : les échos successifs deviennent plus denses et plus chauds, comme sur un écho à bande. À 0 %, la boucle est parfaitement propre.", "meta": "0…100 % · Défaut 0 · Automatisable : oui"}, "dly_freeze": {"label": "FREEZE", "short": "Fige le contenu des lignes en boucle.", "long": "Coupe l'entrée des lignes et pousse le feedback à son maximum : ce qui est en cours de répétition tourne en boucle indéfiniment, comme une nappe. Désactiver FREEZE rend à l'entrée et au feedback leurs réglages.", "meta": "Interrupteur · Défaut 0 · Automatisable : oui ### Réglages de Settings (non automatisables, enregistrés avec le preset) | id | label | type | plage | défaut | |---|---|---|---|---| | `dly_time_mode` | Time change | enum | 0 Glide, 1 Crossfade | 0 | | `dly_glide_ms` | Glide time | float | 20…500 ms | 120 | | `dly_safety_limiter` | Feedback safety limiter | bool | — | 1 | | `dly_pitch_quality` | Pitch quality | enum | 0 Standard (grain 40 ms), 1 High (grain 80 ms) | 0 | | `dly_pan_law` | Pan law | enum | −3 dB, −4,5 dB, −6 dB | −3 dB |"}, "dly_time_mode": {"label": "Time change", "short": "Comportement quand on change le temps d'une ligne.", "long": "Glide : le temps glisse jusqu'à sa nouvelle valeur, ce qui fait varier la hauteur des échos pendant le geste, comme sur un delay à bande. Crossfade : fondu entre l'ancien et le nouveau temps, sans variation de hauteur (plus propre, un peu moins expressif).", "meta": "Choix : Glide, Crossfade · Défaut Glide"}, "dly_safety_limiter": {"label": "Feedback safety limiter", "short": "Évite que le feedback s'emballe.", "long": "Écrête doucement le signal de la boucle au-dessus de 0 dBFS. Recommandé : sans lui, un feedback élevé (ou négatif et global) peut produire une boucle de plus en plus forte.", "meta": "Interrupteur · Défaut actif --- ## 4. Presets d'usine et valeurs par défaut des lignes Valeurs par défaut des lignes (preset « Default ») : ligne N à `500 × N ms` (1/4 × N en sync), niveau `−3 × (N−1) dB`, pan 0, feedback 30 %, lowcut inactif, highcut 20 kHz, pitch 0, offset 0, pas de modulation ; seule la ligne 1 est active. | Preset | Lignes actives (temps · niveau · pan) | Autres | |---|---|---| | Default | 1 : 500 ms · 0 dB · centre | fb 30 %, MIX 35 % | | Slapback | 1 : 110 ms · 0 dB · centre | fb 0 %, drive 10 %, MIX 30 % | | Ping-Pong 1/8 | 1 : 1/8 · 0 dB · G 100 %, 2 : 1/4 · −2 dB · D 100 % | sync, fb 35 % par ligne, ping-pong 60 %, MIX 30 % | | Tape Echo | 1 : 190 ms · 0 · G 30 %, 2 : 380 ms · −4 · D 30 %, 3 : 570 ms · −8 · centre | fb 45 % (ligne 3), lowcut 150 Hz, highcut 4 kHz, mod 20 % à 0,6 Hz, drive 35 %, MIX 28 % | | Dotted Rhythm | 1 : 1/8. · 0 · G 50 %, 2 : 1/4 · −3 · D 50 %, 3 : 1/16 · −6 · centre | sync, fb 30 %, MIX 30 % | | Multi-Tap Bounce | 8 lignes de 90 à 1250 ms (90, 170, 260, 380, 520, 700, 930, 1250), niveaux 0 → −16 dB, pans alternés G/D | highcut décroissant (12 kHz → 3 kHz), MIX 40 % | | Shimmer Pad | 1 : 1/4 · 0 · centre · pitch +12, 2 : 1/2 · −4 · D 60 % · pitch +7 | fb 60 %, mod 25 %, MIX 40 %, drive 0 | | Stereo Haas | 1 : 25 ms · G 100 %, 2 : 35 ms · D 100 % | fb 0 %, width 150 %, MIX 50 % | Un changement de réglage fait passer le preset en « modifié » (astérisque dans l'en-tête). --- ## 5. Sorties d'affichage (lecture seule, non automatisables) | id | Contenu | |---|---| | `dly_duck_gain_out` | gain de ducking courant (0…−24 dB), pour la courbe de la page GLOBAL | | `dly_hit_phase_out` | position du curseur de simulation (0…1), uniquement si l'UI veut animer la vue temporelle en même temps que le DSP | Tout le reste (positions des barres, répétitions du feedback, réponses des filtres) est calculé par l'UI à partir des paramètres. Module vu-mètres : préfixe `meter_`, identique aux autres plugins (IN = entrée après INPUT, OUT après OUTPUT). --- ## 6. Organisation de l'interface (gabarit 1160 × 780, mêmes hauteurs de conteneurs sur les 4 pages) **Page DELAY**"}}/*HELP_END*/;</script>

function loadPreset(i){loading=1;Object.assign(g,GB,PRE[i].g2);for(let k=0;k<8;k++)T[k]={...D8(k),...(PRE[i].t[k]||{})};if(PRE[i].t.length)for(let k=PRE[i].t.length;k<8;k++)T[k].on=0;sel=0;cur=i;modified=0;updName();chg();loading=0}
function buildPm(){pm.innerHTML=PRE.map((p,i)=>(p.g?`<div class="pg">${p.g}</div>`:'')+`<div class="pi${i==cur?' on':''}" data-i="${i}">${p.n}<span class="pv" style="margin-left:auto;font-size:9.5px;color:var(--text-dim2)">${p.t.filter((x,k)=>k==0||x.on).length||1} ligne(s)</span></div>`).join('')}
function pmOpen(){buildPm();const a=$('app'),r=$('irPill').getBoundingClientRect(),ar=a.getBoundingClientRect(),z=ar.width/a.offsetWidth||1;pm.style.display='block';pm.style.left=((r.left-ar.left)/z)+'px';pm.style.top=((r.bottom-ar.top)/z+6)+'px'}
$('irPill').onclick=e=>{e.stopPropagation();pm.style.display=pm.style.display=='block'?'none':pmOpen()};
pm.onclick=e=>{const it=e.target.closest('.pi');if(it){loadPreset(+it.dataset.i);pm.style.display='none'}};
document.addEventListener('click',e=>{if(!e.target.closest('#pm')&&!e.target.closest('#irPill'))pm.style.display='none'});
document.addEventListener('keydown',e=>{if(e.key=='Escape')pm.style.display='none'});
/* ---------- simulation de la page GLOBAL : un coup d'entrée, ses échos, le ducking ---------- */
const cv2=$('cv2');let dim2={w:0,h:0},simKey='',SIM=null;const SN=3600;
function size2(){if(!cv2.clientWidth)return;dim2={w:cv2.clientWidth,h:cv2.clientHeight};cv2.width=dim2.w*devicePixelRatio;cv2.height=dim2.h*devicePixelRatio;cv2.getContext('2d').setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function sim(){const key=JSON.stringify([T,g]);if(key==simKey)return;simKey=key;const inp=new Float32Array(SN),wet=new Float32Array(SN),dk=new Float32Array(SN),out=new Float32Array(SN);
  const hit=(t,t0,a)=>t<t0?0:a*Math.exp(-(t-t0)/60);const hits=[[0,1],[1500,.7],[2300,.5]];
  for(let t=0;t<SN;t++){let v=0;hits.forEach(([t0,a])=>v+=hit(t,t0,a));inp[t]=v}
  const ef=eff();ef.forEach((e,i)=>{if(!e||!audible(i))return;const t=T[i],fb=Math.abs(t.fb)/100*(g.freeze?1:1),lv=lin(e.lv)*Math.sqrt(gL(t)**2+gR(t)**2);
    for(let k=0;k<9;k++){const tm=(k+1)*e.ms,a=lv*Math.pow(fb,k)*(1+Math.abs(g.fbG)/100*.0);if(a<.005)break;hits.forEach(([t0,h])=>{for(let t=Math.round(t0+tm);t<SN;t++)wet[t]+=a*h*Math.exp(-(t-t0-tm)/60)})}});
  let env=0;const ar=1-Math.exp(-1/5),rr=1-Math.exp(-1/Math.max(10,g.duckRel));
  for(let t=0;t<SN;t++){const x=Math.abs(inp[t]);env+=(x>env?ar:rr)*(x-env);const dbv=toDb(env),k=clamp((dbv-(g.duckThr-3))/6,0,1);dk[t]=1-g.duckAmt/100*k*k*(3-2*k);out[t]=wet[t]*dk[t]*(g.mix/100)}
  SIM={inp,wet,dk,out}}
function renderSim(){if(!dim2.w)return;sim();const c=cv2.getContext('2d'),w=dim2.w,h=dim2.h,x0=52,x1=w-16,y0=10,yb=h-90,y1=h-24,X=t=>x0+t/SN*(x1-x0);
  c.clearRect(0,0,w,h);c.font='10px sans-serif';c.lineWidth=1;c.setLineDash([]);c.textAlign='center';c.textBaseline='top';
  for(let t=0;t<=SN;t+=500){const x=X(t);c.strokeStyle=hexA(COL.grid,.4);c.beginPath();c.moveTo(x,y0);c.lineTo(x,y1);c.stroke();c.fillStyle=COL['text-dim'];c.fillText((t/1000).toFixed(1)+' s',x,y1+6)}
  const YA=v=>yb-clamp(v,0,1.15)/1.15*(yb-y0);
  const area=(a,col,al)=>{c.beginPath();c.moveTo(x0,yb);for(let t=0;t<SN;t+=4)c.lineTo(X(t),YA(a[t]));c.lineTo(x1,yb);c.closePath();c.fillStyle=hexA(col,al);c.fill();c.strokeStyle=hexA(col,.9);c.lineWidth=1;c.stroke()};
  area(SIM.inp,COL['text-dim'],.35);area(SIM.wet,COL['pink-2'],.18);area(SIM.out,COL.accent,.45);
  c.strokeStyle=hexA(COL.text,.3);c.beginPath();c.moveTo(x0,yb);c.lineTo(x1,yb);c.stroke();
  c.textAlign='right';c.textBaseline='middle';c.fillStyle=COL['text-dim'];c.fillText('niveau',x0-6,(y0+yb)/2);
  const yd=d=>yb+8+(-d/24)*(y1-yb-8);c.fillText('0 dB',x0-6,yd(0));c.fillText('−24',x0-6,yd(-24));
  c.beginPath();for(let t=0;t<SN;t+=4){const dB=clamp(toDb(SIM.dk[t]),-24,0),x=X(t),y=yd(dB);t?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle=COL['accent-2'];c.lineWidth=1.6;c.stroke();
  c.font='9px sans-serif';c.textBaseline='middle';c.textAlign='right';let lx=x1-6;
  [['GAIN DE DUCKING',COL['accent-2']],['ÉCHOS APRÈS DUCKING',COL.accent],['ÉCHOS SANS DUCKING',hexA(COL['pink-2'],.6)],['ENTRÉE',COL['text-dim']]].forEach(([tx,col])=>{c.fillStyle=COL['text-dim'];c.fillText(tx,lx,y0+8);lx-=c.measureText(tx).width+6;c.fillStyle=col;c.fillRect(lx-8,y0+5,8,6);lx-=18});
  $('simMeta').textContent=g.freeze?'FREEZE actif : les échos tournent en boucle':'3 coups d\'entrée · MIX '+Math.round(g.mix)+' %'+(g.duckAmt?' · ducking '+Math.round(g.duckAmt)+' %':'')}
/* ---------- vu-mètres IN / OUT ---------- */
const rmsProfiles=[{n:'RMS1',ms:250}];let rmsMs=300,peakDecay=40;
const modeList=()=>[{l:'PEAK',ty:0},...rmsProfiles.map(p=>({l:p.n.toUpperCase(),ty:1,ms:p.ms})),{l:'VU',ty:2},{l:'EBU-M',ty:3},{l:'EBU-S',ty:4}],M={};
const grp=k=>`<div class="mgrp${k=='out'?' p':''}"><div class="sat" id="${k}S" title="Crête max ≥ -1 dBFS : cliquer pour remettre à zéro"></div><div class="mt0">${k.toUpperCase()}</div><div class="bars">${[0,1].map(c=>`<div class="vt"><div class="vf" id="${k}F${c}" style="background:linear-gradient(180deg,var(--${k=='in'?'accent-2':'pink-2'}),var(--${k=='in'?'accent':'pink'}))"></div><div class="vp" id="${k}P${c}"></div></div>`).join('')}</div><div class="mval" id="${k}V" title="Cliquer : remettre à zéro les crêtes max (meter_reset)"><div></div><div></div></div><div class="mode" id="${k}M">PEAK</div></div>`;
$('meters').innerHTML=grp('in')+grp('out');
const resetPeaks=()=>['in','out'].forEach(k=>M[k].mx=[-120,-120]);
['in','out'].forEach((k,i)=>{M[k]={m:0,v:[-120,-120],env:[-120,-120],hold:[0,0],mx:[-120,-120],o:i};
  $(k+'M').onclick=()=>{const m=M[k],L=modeList();m.m=(m.m+1)%L.length;const md=L[m.m];if(md.ty==1)rmsMs=md.ms;if(md.ty==2)rmsMs=300};
  $(k+'S').onclick=$(k+'V').onclick=resetPeaks});
function meters(){const dt=16.7,L=modeList(),t=performance.now()/1000,beat=Math.pow(Math.max(0,Math.sin(t*3.1)),6),lvl=-22+4*Math.sin(t*1.3)+16*beat;
  ['in','out'].forEach(k=>{const m=M[k];if(m.m>=L.length)m.m=0;const md=L[m.m],ty=md.ty,win=[0,rmsMs,300,400,3000][ty],off=[0,-3,-3,-5,-6][ty];$(k+'M').textContent=md.l;
  for(let c=0;c<2;c++){
    const base=lvl+(c?-1.2:0)+(k=='out'&&!g.byp?g.outG+g.inG*0+(g.mix>50?2:0)+4*Math.sin(t*2.2+c):0),inst=clamp(base,-120,3);
    if(inst>=m.env[c]){m.env[c]=inst;m.hold[c]=50}else if(m.hold[c]>0)m.hold[c]-=dt;else m.env[c]=Math.max(-120,m.env[c]-peakDecay*dt/1000);
    m.mx[c]=Math.max(m.mx[c],inst);
    if(ty)m.v[c]+=(clamp(base+off,-120,3)-m.v[c])*(1-Math.exp(-dt/win));
    const d=ty?m.v[c]:m.env[c];$(k+'F'+c).style.height=clamp((d+60)/60*100,0,100)+'%';
    const p=$(k+'P'+c);p.style.display=ty?'none':'block';p.style.bottom=clamp((m.mx[c]+60)/60*100,0,100)+'%'}
  const d=Math.max(...(ty?m.v:m.env)),mx=Math.max(...m.mx),v=$(k+'V').children;
  v[0].textContent=(d<-100?'-inf':d.toFixed(1))+(ty>2?' LUFS':' dB');
  v[1].textContent=[mx<-100?'MAX -inf':'MAX '+mx.toFixed(1),rmsMs+' ms','300 ms RMS','400 ms','3 s'][ty];
  $(k+'S').classList.toggle('on',mx>-1)})}
/* ---------- navigation ---------- */
const NAV=document.querySelectorAll('.nav'),NAMES=['DELAY','TAPS','GLOBAL','SETTINGS'];
function setPage(p){page=p;NovaHelp.close();pm.style.display='none';$('stageLabel').textContent=NAMES[p];NAV.forEach((n,i)=>n.classList.toggle('on',i==p));
  const D=(q,v)=>document.querySelector(q).style.display=v;
  D('.top',p==0?'':'none');D('#krow',p==0?'':'none');D('.mp',p==3?'none':'');D('.top2',p==1||p==2?'block':'none');D('#krow2',p==1||p==2?'flex':'none');D('#snav',p==3?'flex':'none');D('#scw',p==3?'block':'none');
  $('pgTaps').style.display=p==1?'flex':'none';$('pgGlob').style.display=p==2?'flex':'none';$('k2taps').style.display=p==1?'flex':'none';$('k2glob').style.display=p==2?'flex':'none';
  if(p==0)size();if(p==2){size2();simKey=''}chg()}
NAV.forEach((n,i)=>n.onclick=()=>setPage(i));
function chg(){if(!loading&&!modified){modified=1;updName()}syncTap();KN.forEach(drawK);syncG2();mxSync();$('invSw').classList.toggle('on',!!T[sel].inv);$('invV').textContent=T[sel].inv?'ON':'OFF';$('uT').textContent='LIGNE '+(sel+1)}
$('bypBtn').onclick=function(){g.byp^=1;this.classList.toggle('act',!g.byp);$('app').classList.toggle('byp',!!g.byp)};

/* ---------- PAGE 4 : SETTINGS ---------- */
const cyc=(id,o,st,fn)=>{const e=$(id);let i=st;e.onclick=()=>{i=(i+1)%o.length;e.textContent=o[i];fn&&fn(o[i],i)}};
const pl=(id,txt,w)=>`<div class="pill" id="${id}" style="width:${w}px;justify-content:center">${txt}</div>`,sw=(id,on)=>`<div class="sw${on?' on':''}" id="${id}"><i></i></div>`,stpr=(id,v,u)=>`<div class="stpr" id="${id}"><div class="stp" data-d="-1">−</div><input class="inp" type="number" value="${v}"><div class="stp" data-d="1">+</div></div><span class="mt">${u}</span>`;
const CARDS=[['s-gen','GENERAL',[['Theme','Sombre / Hammond / Clair / Contraste élevé (accessibilité)',pl('setTheme','<span id="thLbl">DARK</span>',120)],['Interface scale','Taille d\'affichage de la fenêtre du plugin',pl('setScale','100%',90)],['Language','Langue de l\'interface et des textes d\'aide',pl('setLang','FR',90)],['Help buttons','Boutons « ? » d\'aide : toujours visibles, au survol seulement, ou masqués',pl('setHelp','ALWAYS',110)]]],
['s-aud','AUDIO / DSP',[['Sample rate','Valeur communiquée par le DAW hôte','<div class="ro">48 000 Hz</div>'],['Internal precision','Auto = suit le buffer de l\'hôte (32 ou 64 bits)',pl('setPrec','AUTO',90)],['Reported latency','Le délai fait partie de l\'effet : latence nulle','<div class="ro">0 smp</div>'],['Host tempo','Utilisé quand SYNC est actif (valeur fournie par l\'hôte)','<div class="ro">120 BPM</div>']]],
['s-dly','DELAY',[['Time change','Glide : le temps glisse (la hauteur des échos varie) · Crossfade : fondu, sans variation de hauteur',pl('setTMode','GLIDE',110),'dly_time_mode'],['Glide time','Durée du glissement quand on change un temps',stpr('glideBox',120,'ms')],['Feedback safety limiter','Écrête doucement la boucle au-dessus de 0 dBFS pour éviter l\'emballement',sw('setLim',1),'dly_safety_limiter'],['Pitch quality','Taille du grain du décaleur de hauteur : Standard (40 ms) ou High (80 ms, plus lisse, plus de charge)',pl('setPq','STANDARD',110)],['Pan law','Atténuation au centre du panoramique d\'une entrée mono',pl('setLaw','−3 dB',90)]]],
['s-met','METERING',[['Peak decay','Retombée de la crête, en dB/s (meter_peak_decay). La remise à zéro des crêtes max se fait en cliquant sur la valeur ou la LED.',stpr('pkBox',40,'dB/s')],
  ['RMS profiles','S\'intègrent au cycle du bouton PEAK des vu-mètres. La fenêtre RMS est partagée entre IN et OUT.','<div class="pill" id="addRms">+ ADD PROFILE</div>']]],
['s-pre','PRESETS',[['Default folder','Dossier ouvert par le sélecteur de presets','<div class="ro" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">~/Documents/NOVA/Presets</div><div class="pill">BROWSE</div>'],['On new instance','Preset chargé à la création du plugin',pl('setLoad','DEFAULT',120)],['Import / export','Fichiers de presets','<div class="pill">IMPORT</div><div class="pill">EXPORT</div>']]],
['s-int','INTERACTION',[['Knob drag sensitivity','',pl('setSens','NORMAL',90)],['Double-click resets parameter','',sw('setDbl',1)],['Mouse wheel on knobs / points','',sw('setWheel',1)]]],
['s-abt','ABOUT',[['Version','','<div class="ro">1.0.0</div>'],['Documentation','','<span class="lnk">Ouvrir →</span>'],['Support','','<span class="lnk">Contacter →</span>'],['Updates','','<div class="pill">CHECK FOR UPDATES</div>']]]];
$('sc').innerHTML=CARDS.map(([id,t,rows])=>`<div class="card" id="${id}"><div class="ct"><span class="dot"></span>${t}</div>`+rows.map(([l,d,c,h])=>l=='RMS profiles'?`<div class="srow" style="display:block"><div class="sctl" style="justify-content:space-between"><div><div class="slab">${l}</div><div class="sdesc">${d}</div></div>${c}</div><div id="rmsList"></div></div>`:`<div class="srow"><div><div class="slab"${h?` data-hid="${h}"`:''}>${l}</div>${d?`<div class="sdesc">${d}</div>`:''}</div><div class="sctl">${c}</div></div>`).join('')+'</div>').join('');
$('setTheme').onclick=()=>$('themeBtn').click();
cyc('setLang',['FR','EN'],0);cyc('setLoad',['DEFAULT','LAST USED'],0);cyc('setSens',['NORMAL','FINE'],0,(v,i)=>sens=i?.3:1);cyc('setPrec',['AUTO','32-BIT','64-BIT'],0);
cyc('setTMode',['GLIDE','CROSSFADE'],0,(v,i)=>g.tmode=i);cyc('setPq',['STANDARD','HIGH'],0,(v,i)=>g.pq=i);cyc('setLaw',['−3 dB','−4.5 dB','−6 dB'],0,(v,i)=>g.law=i);
$('setLim').onclick=function(){this.classList.toggle('on');g.lim=this.classList.contains('on')?1:0};
$('setDbl').onclick=function(){this.classList.toggle('on');dbl=this.classList.contains('on')};$('setWheel').onclick=function(){this.classList.toggle('on');wheelOn=this.classList.contains('on')};
function stp(box,min,max,step,fn){const inp=box.querySelector('input');box.querySelectorAll('.stp').forEach(b=>b.onclick=()=>{inp.value=clamp((+inp.value||0)+b.dataset.d*step,min,max);fn(+inp.value)});inp.oninput=()=>fn(clamp(+inp.value||min,min,max))}
stp($('pkBox'),5,300,5,v=>peakDecay=v);stp($('glideBox'),20,500,10,v=>g.glide=v);
function renderRms(){const L=$('rmsList');L.innerHTML='';rmsProfiles.forEach((p,i)=>{const r=document.createElement('div');r.className='rmsr';
  r.innerHTML=`<input class="inp nm" value="${p.n}" maxlength="6"><div class="stpr"><div class="stp" data-d="-1">−</div><input class="inp" type="number" value="${p.ms}"><div class="stp" data-d="1">+</div></div><span class="mt">ms</span><div class="stp" style="margin-left:auto" title="Supprimer">✕</div>`;
