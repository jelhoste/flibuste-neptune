<body>
<div id="stage">
<div class="stage-label" id="stageLabel">CONVOLUTION</div>
<div id="app" class="app-frame">
  <div class="header">

      <div><div class="word">NOVA</div><div class="sub">LOW LATENCY CONVOLVER</div></div></div>
    <div class="pill" id="irPill" title="Choisir une réponse impulsionnelle (.wav)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span id="irName"></span><span class="chip" id="irStatus"></span>
    </div>
    <div class="hr"><div class="cpill" id="cPill" role="group" aria-label="Contraste"><button id="cMinus" aria-label="Diminuer le contraste">−</button><span class="cl"><svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span id="cLvl">0</span></span><button id="cPlus" aria-label="Augmenter le contraste">+</button></div><div class="ibtn" id="themeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div></div>
  </div>
  <div class="body">
    <div class="mp" id="meters"></div>
    <aside class="side">
      <div class="nav on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h3l2-7 3 14 3-10 2 3h7"/></svg>CONVOLUTION</div>
      <div class="nav" ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3"/></svg>EQUALIZER</div>
      <div class="nav" ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>SETTINGS</div>
    </aside>
    <div class="top"><div class="panel">
      <div class="ptr"><div class="pt"><span class="dot"></span>IMPULSE RESPONSE</div>
        <div class="pill" id="viewBtn" style="width:112px;justify-content:center">WAVE</div>
        <div class="meta" id="irMeta"></div></div>
      <div class="cw"><canvas id="cv"></canvas></div>
      <div class="tb" id="tb"></div>
    </div></div>
    <div class="krow" id="krow"></div>
    <div class="top2"><div class="panel">
      <div class="ptr"><div class="pt" data-hid="conv_eq_wet"><span class="dot"></span>OUTPUT EQ · SIGNAL WET UNIQUEMENT</div>
        <span class="mt">IR SPECTRUM</span><div class="sw on" id="specSw"><i></i></div>
        <span class="mt">EQ</span><div class="sw on" id="eqSw"><i></i></div></div>
      <div class="cw"><canvas id="cv2"></canvas></div>
